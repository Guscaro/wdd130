<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <div class="form-section">
                <h2>Contact Information</h2>
                <div class="form-item column2">
                    <label for="Full name">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>    
            </div>


            <div class="form-section2">
                <h2>Questions</h2>
                <div class="form-item column1">
                        <label for="browser">What is your favorite browser</label>
                    <select name="browser" id="browser">
                        <option value="1">Chrome</option>
                        <option value="2">Firefox</option>
                        <option value="3">Edge</option>
                        <option value="4">Brave</option>
                        <option value="5">Other</option>
                    </select>
                </div>
                <div class="form-item column1 pet">    
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>    
                <div class="form-item centered-item">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="4"
                    placeholder="cochabamba, santa cruz, la paz, oruro, potosi"></textarea>
                </div>    
            </div>    
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p>2026 | HTML Form - User Poll Actvity | Gustavo Camargo</p>
    </footer>
</body>

</html>
